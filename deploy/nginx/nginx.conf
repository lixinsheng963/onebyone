worker_processes 2;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 12m;
  server_tokens off;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  upstream campus_api {
    server api:3000;
  }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://campus_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 60s;
    }

    location = /healthz {
      proxy_pass http://campus_api/healthz;
    }

    # Local image fallback. If COS is configured, media URLs point to COS instead.
    location /uploads/ {
      proxy_pass http://campus_api;
      expires 1h;
    }

    location / {
      root /usr/share/nginx/html/admin;
      try_files $uri $uri/ /index.html;
    }
  }
}
