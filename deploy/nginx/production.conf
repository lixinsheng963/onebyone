# Production reverse proxy for the campus mini-program.
# Replace campus.example.com and the certificate paths before enabling.
# The API listens on 127.0.0.1:3000 behind this proxy.

limit_req_zone $binary_remote_addr zone=campus_api:10m rate=20r/s;

server {
    listen 80;
    server_name campus.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name campus.example.com;

    ssl_certificate     /etc/nginx/ssl/campus.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/campus.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 10m;

    # Admin SPA (built by `pnpm --filter @campus/admin build`).
    root /var/www/campus/admin;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=campus_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        access_log off;
    }

    # Local-storage images. In production prefer COS + CDN; keep this only when
    # DATA_MODE=mysql and COS is intentionally not configured.
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
